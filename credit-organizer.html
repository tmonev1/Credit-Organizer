<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Кредитен тефтер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кредитен тефтер">
<meta name="theme-color" content="#1C2B45">
<style>
  :root {
    --bg: #F5F2E9;
    --panel: #FFFFFF;
    --navy: #1C2B45;
    --navyDeep: #131E33;
    --navySoft: #3A4E6E;
    --teal: #2F6459;
    --tealSoft: #E3EEE9;
    --brick: #9C3B2A;
    --brickSoft: #F5E3DE;
    --gold: #A97A2F;
    --ink: #26241F;
    --muted: #847F72;
    --line: #E1DAC7;
    --amberSoft: #F6EBD8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
  body {
    font-family: Georgia, 'Iowan Old Style', serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  input, select, textarea, button { font-family: -apple-system, system-ui, sans-serif; }
  .sans { font-family: -apple-system, system-ui, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  @media (min-width: 768px) { #app { flex-direction: row; } }

  .sidebar { background: var(--navy); width: 100%; display: flex; flex-direction: column; }
  @media (min-width: 768px) { .sidebar { width: 320px; min-height: 100vh; } }
  .sidebar-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--navySoft); }
  .sidebar-title { color: #EDE7D6; font-size: 20px; }
  .sidebar-sub { color: #9AA6BB; font-size: 12.5px; margin-top: 3px; }
  .sidebar-sub .warn { color: #E5A79A; }
  .sidebar-controls { padding: 14px 16px; }
  .search-input {
    width: 100%; background: var(--navyDeep); border: 1px solid var(--navySoft);
    border-radius: 6px; padding: 9px 12px; color: #EDE7D6; font-size: 13.5px; outline: none;
  }
  .add-btn {
    width: 100%; margin-top: 10px; background: var(--gold); border: none; border-radius: 6px;
    padding: 10px 12px; color: #231A08; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .backup-row { display: flex; gap: 8px; margin-top: 8px; }
  .backup-btn {
    flex: 1; background: var(--navyDeep); border: 1px solid var(--navySoft); border-radius: 6px;
    padding: 8px 6px; color: #C7D0DE; font-size: 11.5px; cursor: pointer; text-align: center;
  }
  .client-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; max-height: 40vh; }
  @media (min-width: 768px) { .client-list { max-height: none; } }
  .client-row {
    width: 100%; text-align: left; background: transparent; border: none;
    border-bottom: 1px solid var(--navySoft); border-left: 3px solid transparent;
    padding: 12px 12px 12px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .client-row.selected { background: var(--navySoft); border-left: 3px solid var(--gold); }
  .client-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .client-name { color: #F2EEE1; font-size: 14.5px; }
  .client-delay-badge { font-size: 11.5px; color: #F6D9D0; background: #6E2F22; border-radius: 4px; padding: 1px 6px; flex-shrink: 0; }
  .client-row-bottom { display: flex; justify-content: space-between; font-size: 12px; color: #9AA6BB; }
  .empty-note { color: #7E8AA0; font-size: 13px; padding: 20px 12px; }

  .main-pane { flex: 1; min-width: 0; padding: 22px 16px 40px; }
  .empty-main { min-height: 400px; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .empty-main-inner { text-align: center; color: var(--muted); max-width: 320px; }
  .empty-main-title { font-size: 15px; color: var(--ink); margin-bottom: 4px; }
  .empty-main-body { font-size: 13px; }

  .client-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .client-title { font-size: 32px; color: var(--navy); line-height: 1.15; }
  .info-card {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-top: 14px;
  }
  .info-field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .info-field-value { font-size: 19px; color: var(--ink); font-family: Georgia, serif; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; color: var(--navy); }
  .icon-btn.danger { color: var(--brick); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 18px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .stat-label { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .stat-value { font-size: 17px; }
  .stat-value.brick { color: var(--brick); }
  .stat-value.teal { color: var(--teal); }

  .overdue-banner {
    margin-top: 14px; background: var(--brickSoft); border: 1px solid #E3C3B7; border-radius: 6px;
    padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6E2818;
  }

  .grid-2col { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 24px; }
  @media (min-width: 900px) { .grid-2col { grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); } }

  .panel-box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--amberSoft); font-size: 13.5px; font-weight: 600; color: var(--navy);
  }
  .link-btn { background: transparent; border: none; font-size: 11.5px; color: var(--gold); cursor: pointer; }
  .empty-schedule { padding: 18px 14px; font-size: 13px; color: var(--muted); }
  .date-select-row { display: flex; gap: 8px; flex: 1; min-width: 0; }
  .date-select { flex: 1; min-width: 0; }
  .payment-add-row { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .payment-add-row .date-select-row { min-width: 180px; }
  .pay-amount-input { width: 90px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 16px; outline: none; }
  .payment-add-row button { background: var(--teal); color: #fff; border: none; border-radius: 6px; padding: 9px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .payment-list { max-height: 220px; overflow-y: auto; }
  .payment-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 13px; }
  .payment-del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 6px; }

  table.sched { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.sched th { text-align: left; padding: 7px 12px; font-weight: 500; font-size: 11.5px; color: var(--muted); }
  table.sched td { padding: 7px 12px; border-top: 1px solid var(--line); }
  .sched-wrap { max-height: 360px; overflow-y: auto; }
  .overdue-pill { font-size: 11px; color: #6E2818; background: var(--brickSoft); border-radius: 4px; padding: 1px 7px; }
  .paid-toggle {
    width: 22px; height: 22px; border-radius: 4px; cursor: pointer; border: 1px solid var(--line);
    background: transparent; display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .paid-toggle.paid { background: var(--teal); border-color: var(--teal); color: #fff; }

  .cal-nav-btn { background: transparent; border: none; cursor: pointer; color: var(--navy); font-size: 16px; padding: 4px 8px; }
  .cal-body { padding: 12px 12px 14px; }
  .cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .cal-dow { text-align: center; font-size: 10.5px; color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 5px; border: 1px solid var(--line); display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11.5px; position: relative;
  }
  .cal-cell.today { border: 1.5px solid var(--navy); }
  .cal-cell.overdue { background: var(--brickSoft); }
  .cal-cell.paidday { background: var(--tealSoft); }
  .cal-cell.upcoming { background: var(--amberSoft); }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 2px; }
  .cal-legend { display: flex; gap: 12px; margin-top: 12px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .legend-dot { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .note-section { margin-top: 24px; }
  .note-label { display: flex; align-items: center; gap: 6px; color: var(--navy); font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .note-textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    font-size: 13.5px; color: var(--ink); outline: none; resize: vertical;
  }

  .main-layout { display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
  @media (min-width: 1050px) {
    .main-layout { flex-direction: row; }
    .main-content-col { flex: 1; min-width: 0; }
    .notes-sidebar { width: 300px; flex-shrink: 0; position: sticky; top: 20px; }
  }
  .notes-panel { display: flex; flex-direction: column; }
  .note-add-row { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .note-add-textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 16px;
    color: var(--ink); outline: none; resize: vertical; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif;
  }
  .note-add-btn { background: var(--navy); color: #EDE7D6; border: none; border-radius: 6px; padding: 9px 12px; font-size: 13px; cursor: pointer; align-self: flex-end; }
  .note-list { max-height: 480px; overflow-y: auto; }
  .note-item { padding: 12px 14px; border-top: 1px solid var(--line); }
  .note-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .note-item-date { font-size: 11px; color: var(--muted); }
  .note-del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 6px; }
  .note-item-text { font-size: 13.5px; color: var(--ink); line-height: 1.5; font-family: -apple-system, system-ui, sans-serif; white-space: pre-wrap; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(19,30,51,0.55); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-box { background: var(--panel); border-radius: 8px; padding: 22px; width: 100%; max-width: 420px; box-shadow: 0 12px 32px rgba(0,0,0,0.18); max-height: 90vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title { font-size: 17px; color: var(--navy); font-family: Georgia, serif; }
  .modal-close { background: transparent; border: none; cursor: pointer; color: var(--muted); font-size: 18px; }
  .field { margin-bottom: 12px; flex: 1; }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 16px;
    color: var(--ink); outline: none; box-sizing: border-box; background: #fff;
  }
  .field-row { display: flex; gap: 10px; }
  .form-hint { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; }
  .form-error { color: var(--brick); font-size: 12.5px; margin-bottom: 10px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-primary { background: var(--navy); color: #EDE7D6; border: none; border-radius: 6px; padding: 9px 16px; font-size: 13.5px; cursor: pointer; }
  .btn-primary.danger { background: var(--brick); }
  .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 9px 16px; font-size: 13.5px; cursor: pointer; }

  .loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .lock-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .lock-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 28px;
    width: 100%; max-width: 320px; text-align: center;
  }
  .lock-title { font-size: 18px; color: var(--navy); margin-bottom: 16px; }
  .lock-input {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 16px;
    text-align: center; outline: none; box-sizing: border-box; margin-bottom: 10px; font-family: ui-sans-serif, system-ui;
    letter-spacing: 2px;
  }
  .lock-btn {
    width: 100%; background: var(--navy); color: #EDE7D6; border: none; border-radius: 6px;
    padding: 10px 12px; font-size: 14px; cursor: pointer; font-family: ui-sans-serif, system-ui;
  }
  .lock-error { color: var(--brick); font-size: 12.5px; margin-top: 10px; min-height: 16px; font-family: ui-sans-serif, system-ui; }
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Зареждане на органайзера…</div></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "credit-clients-v1";
  var DAY_MS = 24 * 60 * 60 * 1000;
  var BG_DAYS = ["пн", "вт", "ср", "чт", "пт", "сб", "нд"];
  var BG_MONTHS = ["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
  var FREQUENCIES = {
    weekly: { label: "Ежеседмична", periodLabel: "Седм." },
    biweekly: { label: "Двуседмична", periodLabel: "Период" },
    monthly: { label: "Месечна", periodLabel: "Мес." }
  };

  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function toISODate(d) {
    var dt = new Date(d);
    var y = dt.getFullYear();
    var m = String(dt.getMonth() + 1).padStart(2, "0");
    var day = String(dt.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function startOfDay(d) { var dt = new Date(d); dt.setHours(0,0,0,0); return dt; }
  function addPeriod(date, frequency, count) {
    var dt = new Date(date);
    if (frequency === "weekly") dt.setDate(dt.getDate() + 7 * count);
    else if (frequency === "biweekly") dt.setDate(dt.getDate() + 14 * count);
    else if (frequency === "monthly") dt.setMonth(dt.getMonth() + count);
    else dt.setDate(dt.getDate() + 7 * count);
    return dt;
  }
  function formatDateBG(iso) {
    if (!iso) return "—";
    var p = iso.split("-");
    return p[2] + "." + p[1] + "." + p[0];
  }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function toISODateTime(d) {
    var dt = new Date(d);
    return dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate()) + "T" + pad2(dt.getHours()) + ":" + pad2(dt.getMinutes());
  }
  function formatDateTimeBG(iso) {
    if (!iso) return "—";
    var datePart = iso.split("T")[0];
    var timePart = iso.split("T")[1] || "";
    return formatDateBG(datePart) + (timePart ? ", " + timePart + " ч." : "");
  }
  function formatMoney(n) {
    var num = Number(n) || 0;
    return num.toLocaleString("bg-BG", { maximumFractionDigits: 2 }) + " €";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function generateSchedule(amount, installment, firstDueDateISO, frequency, explicitCount) {
    var amt = Number(amount) || 0;
    var inst = Number(installment) || 0;
    if (amt <= 0 || inst <= 0) return [];
    var freq = FREQUENCIES[frequency] ? frequency : "weekly";
    var periods = (explicitCount && explicitCount > 0) ? Math.round(explicitCount) : Math.max(1, Math.ceil(amt / inst));
    var first = startOfDay(firstDueDateISO || addPeriod(new Date(), freq, 1));
    var schedule = [];
    var remaining = amt;
    for (var i = 0; i < periods; i++) {
      var dueDate = i === 0 ? first : addPeriod(first, freq, i);
      var thisAmount = i === periods - 1 ? Math.round(remaining * 100) / 100 : inst;
      remaining = Math.round((remaining - thisAmount) * 100) / 100;
      schedule.push({ id: uid(), week: i + 1, dueDate: toISODate(dueDate), amount: thisAmount });
    }
    return schedule;
  }

  // Applies the client's total logged payments against the schedule in due-date order.
  // Overpayment on one installment automatically rolls forward to cover the next one(s).
  function allocatePayments(schedule, payments) {
    var pool = (payments || []).reduce(function (sum, p) { return sum + (Number(p.amount) || 0); }, 0);
    pool = Math.round(pool * 100) / 100;
    return (schedule || []).map(function (item) {
      var amt = Number(item.amount) || 0;
      var paidAmount;
      if (pool >= amt) { paidAmount = amt; pool = Math.round((pool - amt) * 100) / 100; }
      else if (pool > 0) { paidAmount = pool; pool = 0; }
      else { paidAmount = 0; }
      var remaining = Math.round((amt - paidAmount) * 100) / 100;
      return Object.assign({}, item, { paidAmount: paidAmount, remaining: remaining });
    });
  }

  function computeSummary(schedule, payments) {
    var allocated = allocatePayments(schedule, payments);
    var today = startOfDay(new Date());
    var totalDue = 0, totalPaidApplied = 0, overdueAmount = 0, overdueCount = 0, earliestOverdue = null;
    allocated.forEach(function (item) {
      totalDue += item.amount;
      totalPaidApplied += item.paidAmount;
      if (item.remaining > 0.004 && startOfDay(item.dueDate) < today) {
        overdueAmount += item.remaining;
        overdueCount++;
        if (!earliestOverdue || startOfDay(item.dueDate) < startOfDay(earliestOverdue)) earliestOverdue = item.dueDate;
      }
    });
    var days = earliestOverdue ? Math.round((today - startOfDay(earliestOverdue)) / DAY_MS) : 0;
    var totalPaidLogged = (payments || []).reduce(function (s, p) { return s + (Number(p.amount) || 0); }, 0);
    var paidInstallments = allocated.filter(function (i) { return i.remaining <= 0.004; }).length;
    return {
      allocated: allocated,
      totalDue: Math.round(totalDue * 100) / 100,
      totalPaid: Math.round(totalPaidLogged * 100) / 100,
      overdueAmount: Math.round(overdueAmount * 100) / 100,
      overdueCount: overdueCount,
      days: days,
      paidInstallments: paidInstallments,
      totalInstallments: allocated.length
    };
  }

  // ---- state ----
  var state = {
    clients: [],
    selectedId: null,
    query: "",
    showForm: false,
    editingId: null,
    form: emptyForm(),
    formError: "",
    confirmDeleteId: null,
    calCursor: (function () { var n = new Date(); return { year: n.getFullYear(), month: n.getMonth() }; })(),
    markCount: ""
  };

  function emptyForm() {
    return { name: "", phone: "", creditNumber: "", amount: "", installment: "", installmentCount: "", frequency: "weekly", firstDueDate: "",
      workplace: "", contactName: "", contactPhone: "" };
  }

  function loadClients() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.clients = Array.isArray(parsed) ? parsed : [];
      }
    } catch (e) { /* ignore */ }
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.clients)); } catch (e) { /* ignore, e.g. private mode */ }
  }

  function getSelected() {
    for (var i = 0; i < state.clients.length; i++) if (state.clients[i].id === state.selectedId) return state.clients[i];
    return null;
  }

  // ---- actions ----
  function selectClient(id) {
    state.selectedId = id;
    var c = getSelected();
    render();
  }

  function openAddForm() {
    state.form = emptyForm();
    state.editingId = null;
    state.formError = "";
    state.showForm = true;
    render();
  }

  function openEditForm(client) {
    state.form = {
      name: client.name || "",
      phone: client.phone || "",
      creditNumber: client.creditNumber || "",
      amount: client.amount != null ? String(client.amount) : "",
      installment: client.installment != null ? String(client.installment) : "",
      installmentCount: client.schedule && client.schedule.length ? String(client.schedule.length) : "",
      frequency: client.frequency || "weekly",
      firstDueDate: client.firstDueDate || (client.schedule && client.schedule[0] ? client.schedule[0].dueDate : ""),
      workplace: client.workplace || "",
      contactName: client.contactName || "",
      contactPhone: client.contactPhone || "",
    };
    state.editingId = client.id;
    state.formError = "";
    state.showForm = true;
    render();
  }

  function closeForm() { state.showForm = false; state.formError = ""; render(); }

  function submitForm(e) {
    e.preventDefault();
    var f = state.form;
    if (!f.name.trim()) { state.formError = "Въведи име на клиента."; render(); return; }
    var amountNum = Number(f.amount);
    var installmentNum = Number(f.installment);
    if (f.amount && (isNaN(amountNum) || amountNum < 0)) { state.formError = "Размерът на кредита трябва да е число."; render(); return; }
    if (f.installment && (isNaN(installmentNum) || installmentNum < 0)) { state.formError = "Вноската трябва да е число."; render(); return; }

    var frequency = FREQUENCIES[f.frequency] ? f.frequency : "weekly";
    var firstDueDate = f.firstDueDate || "";
    var explicitCount = f.installmentCount ? parseInt(f.installmentCount, 10) : 0;
    if (f.installmentCount && (isNaN(explicitCount) || explicitCount <= 0)) { state.formError = "Броят вноски трябва да е положително число."; render(); return; }

    if (state.editingId) {
      state.clients = state.clients.map(function (c) {
        if (c.id !== state.editingId) return c;
        var newAmount = f.amount === "" ? c.amount : amountNum;
        var newInstallment = f.installment === "" ? c.installment : installmentNum;
        var effectiveFirstDue = firstDueDate || c.firstDueDate;
        var schedule = c.schedule;
        if (newAmount > 0 && newInstallment > 0) {
          schedule = generateSchedule(newAmount, newInstallment, effectiveFirstDue, frequency, explicitCount);
        }
        return Object.assign({}, c, {
          name: f.name.trim(), phone: f.phone.trim(), creditNumber: f.creditNumber.trim(),
          amount: newAmount, installment: newInstallment, frequency: frequency,
          firstDueDate: effectiveFirstDue,
          workplace: f.workplace.trim(), contactName: f.contactName.trim(), contactPhone: f.contactPhone.trim(),
          schedule: schedule
        });
      });
    } else {
      var createdDate = toISODate(new Date());
      var schedule2 = amountNum > 0 && installmentNum > 0 ? generateSchedule(amountNum, installmentNum, firstDueDate, frequency, explicitCount) : [];
      var newClient = {
        id: uid(), name: f.name.trim(), phone: f.phone.trim(), creditNumber: f.creditNumber.trim(),
        amount: f.amount === "" ? 0 : amountNum, installment: f.installment === "" ? 0 : installmentNum,
        frequency: frequency, firstDueDate: firstDueDate || (schedule2[0] ? schedule2[0].dueDate : ""),
        workplace: f.workplace.trim(), contactName: f.contactName.trim(), contactPhone: f.contactPhone.trim(),
        createdDate: createdDate, schedule: schedule2, payments: [], notes: []
      };
      state.clients = [newClient].concat(state.clients);
      state.selectedId = newClient.id;
    }
    state.showForm = false;
    persist();
    render();
  }

  function deleteClient(id) {
    state.clients = state.clients.filter(function (c) { return c.id !== id; });
    if (state.selectedId === id) state.selectedId = null;
    state.confirmDeleteId = null;
    persist();
    render();
  }

  function regenerateSchedule(client) {
    var firstDueDate = client.firstDueDate || toISODate(addPeriod(new Date(), client.frequency || "weekly", 1));
    var keepCount = client.schedule && client.schedule.length ? client.schedule.length : 0;
    var schedule = generateSchedule(client.amount, client.installment, firstDueDate, client.frequency || "weekly", keepCount);
    state.clients = state.clients.map(function (c) { return c.id === client.id ? Object.assign({}, c, { schedule: schedule, firstDueDate: firstDueDate }) : c; });
    persist();
    render();
  }

  function addPayment(clientId, dateISO, amount) {
    var amt = Number(amount);
    if (!dateISO || isNaN(amt) || amt <= 0) return;
    state.clients = state.clients.map(function (c) {
      if (c.id !== clientId) return c;
      var payments = (c.payments || []).concat([{ id: uid(), date: dateISO, amount: Math.round(amt * 100) / 100 }]);
      return Object.assign({}, c, { payments: payments });
    });
    persist();
    render();
  }

  function deletePayment(clientId, paymentId) {
    state.clients = state.clients.map(function (c) {
      if (c.id !== clientId) return c;
      return Object.assign({}, c, { payments: (c.payments || []).filter(function (p) { return p.id !== paymentId; }) });
    });
    persist();
    render();
  }

  function addNote(clientId, text) {
    var trimmed = (text || "").trim();
    if (!trimmed) return;
    state.clients = state.clients.map(function (c) {
      if (c.id !== clientId) return c;
      var notes = (c.notes || []).concat([{ id: uid(), dateTime: toISODateTime(new Date()), text: trimmed }]);
      return Object.assign({}, c, { notes: notes });
    });
    persist();
    render();
  }

  function deleteNote(clientId, noteId) {
    state.clients = state.clients.map(function (c) {
      if (c.id !== clientId) return c;
      return Object.assign({}, c, { notes: (c.notes || []).filter(function (n) { return n.id !== noteId; }) });
    });
    persist();
    render();
  }

  function exportBackup() {
    var dataStr = JSON.stringify(state.clients, null, 2);
    var blob = new Blob([dataStr], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var today = toISODate(new Date());
    a.href = url;
    a.download = "krediten-organizer-backup-" + today + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var parsed = JSON.parse(e.target.result);
        if (!Array.isArray(parsed)) { alert("Файлът не изглежда да е валидно резервно копие."); return; }
        var replace = confirm("Да заменя ли текущите клиенти (" + state.clients.length + ") с тези от файла (" + parsed.length + ")? Отказ = добавяне към текущите.");
        if (replace) {
          state.clients = parsed;
        } else {
          state.clients = state.clients.concat(parsed);
        }
        state.selectedId = null;
        persist();
        render();
      } catch (err) {
        alert("Файлът не можа да бъде прочетен като резервно копие.");
      }
    };
    reader.readAsText(file);
  }

  // ---- render ----
  function render() {
    var app = document.getElementById("app");
    app.innerHTML = renderSidebar() + renderMainPane() + (state.showForm ? renderFormModal() : "") + (state.confirmDeleteId ? renderConfirmModal() : "");
    attachHandlers();
  }

  function filteredClients() {
    var q = state.query.trim().toLowerCase();
    if (!q) return state.clients;
    return state.clients.filter(function (c) {
      return (c.name || "").toLowerCase().indexOf(q) !== -1 ||
        (c.creditNumber || "").toLowerCase().indexOf(q) !== -1 ||
        (c.phone || "").toLowerCase().indexOf(q) !== -1;
    });
  }

  function renderSidebar() {
    var clients = filteredClients();
    var overdueClients = 0;
    state.clients.forEach(function (c) { if (computeSummary(c.schedule, c.payments).days > 0) overdueClients++; });

    var rows = clients.map(function (c) {
      var summary = computeSummary(c.schedule, c.payments);
      var selected = c.id === state.selectedId;
      return '<button class="client-row' + (selected ? ' selected' : '') + '" data-select="' + c.id + '">' +
        '<div class="client-row-top"><span class="client-name">' + esc(c.name || "Без име") + '</span>' +
        (summary.days > 0 ? '<span class="client-delay-badge mono">' + summary.days + ' дни</span>' : '') +
        '</div>' +
        '<div class="client-row-bottom mono"><span>' + esc(c.creditNumber || "—") + '</span><span>' + formatMoney(c.installment) + '</span></div>' +
        '</button>';
    }).join("");

    return '<div class="sidebar">' +
      '<div class="sidebar-header">' +
      '<div class="sidebar-title">Кредитен тефтер</div>' +
      '<div class="sidebar-sub sans">' + state.clients.length + (state.clients.length === 1 ? ' клиент' : ' клиенти') +
      (overdueClients > 0 ? ' <span class="warn">· ' + overdueClients + ' със закъснение</span>' : '') + '</div>' +
      '</div>' +
      '<div class="sidebar-controls">' +
      '<input class="search-input" id="search-input" placeholder="Търси по име, телефон, №..." value="' + esc(state.query) + '">' +
      '<button class="add-btn" id="add-client-btn">+ Нов клиент</button>' +
      '<div class="backup-row"><button class="backup-btn" id="export-btn">⬇ Запази резервно копие</button>' +
      '<button class="backup-btn" id="import-btn">⬆ Зареди копие</button></div>' +
      '<input type="file" id="import-file-input" accept="application/json" style="display:none">' +
      '</div>' +
      '<div class="client-list">' + (clients.length === 0 ? '<div class="empty-note sans">Няма намерени клиенти.</div>' : rows) + '</div>' +
      '</div>';
  }

  function renderMainPane() {
    var client = getSelected();
    if (!client) {
      return '<div class="main-pane"><div class="empty-main"><div class="empty-main-inner">' +
        '<div class="empty-main-title">Избери клиент от списъка</div>' +
        '<div class="empty-main-body sans">или добави нов, за да видиш неговата персонална страница с погасителен план и календар.</div>' +
        '</div></div></div>';
    }

    var summary = computeSummary(client.schedule, client.payments);
    var schedule = client.schedule || [];
    var freqInfo = FREQUENCIES[client.frequency] || FREQUENCIES.weekly;

    var html = '<div class="main-pane">';
    html += '<div class="main-layout">';
    html += '<div class="main-content-col">';

    html += '<div class="client-header">' +
      '<div class="client-title">' + esc(client.name) + '</div>' +
      '<div class="header-actions"><button class="icon-btn" data-edit="' + client.id + '">✎</button>' +
      '<button class="icon-btn danger" data-delete="' + client.id + '">✕</button></div>' +
      '</div>';

    html += '<div class="info-card">' +
      infoField("Телефон", client.phone) +
      infoField("Номер на кредит", client.creditNumber) +
      infoField("Месторабота", client.workplace) +
      infoField("Лице за контакт", client.contactName ? (client.contactName + (client.contactPhone ? " · " + client.contactPhone : "")) : (client.contactPhone || "")) +
      '</div>';

    html += '<div class="stat-grid">' +
      statCard("Размер на кредита", formatMoney(client.amount), "") +
      statCard("Вноска (" + freqInfo.label.toLowerCase() + ")", formatMoney(client.installment), "") +
      statCard("Брой вноски", String(summary.totalInstallments), "") +
      statCard("Платено общо", formatMoney(summary.totalPaid), "teal") +
      statCard("Дължимо към днешна дата", formatMoney(summary.overdueAmount), summary.overdueAmount > 0 ? "brick" : "teal") +
      statCard("Закъснение", summary.days > 0 ? summary.days + " дни" : "няма", summary.days > 0 ? "brick" : "teal") +
      '</div>';

    if (summary.days > 0) {
      html += '<div class="overdue-banner sans">⚠ ' + summary.overdueCount + (summary.overdueCount === 1 ? ' просрочена вноска' : ' просрочени вноски') +
        ' на обща стойност ' + formatMoney(summary.overdueAmount) + '.</div>';
    }

    html += '<div class="grid-2col">' + renderScheduleTable(client, freqInfo, summary) + renderCalendar(client) + '</div>';

    html += renderPaymentsPanel(client);

    html += '</div>'; // .main-content-col

    html += '<div class="notes-sidebar">' + renderNotesPanel(client) + '</div>';

    html += '</div>'; // .main-layout
    html += '</div>';
    return html;
  }

  function statCard(label, value, tone) {
    return '<div class="stat-card"><div class="stat-label sans">' + label + '</div>' +
      '<div class="stat-value mono' + (tone ? ' ' + tone : '') + '">' + value + '</div></div>';
  }

  function infoField(label, value) {
    return '<div class="info-field">' +
      '<div class="info-field-label sans">' + label + '</div>' +
      '<div class="info-field-value">' + esc(value || "—") + '</div>' +
      '</div>';
  }

  function getClientNotes(client) {
    if (client.notes && client.notes.length) return client.notes;
    if (client.note) return [{ id: "legacy", dateTime: client.createdDate || "", text: client.note }];
    return [];
  }

  function renderNotesPanel(client) {
    var notes = getClientNotes(client).slice().sort(function (a, b) { return (b.dateTime || "").localeCompare(a.dateTime || ""); });
    var rows = notes.map(function (n) {
      return '<div class="note-item">' +
        '<div class="note-item-head">' +
        '<span class="note-item-date mono">' + esc(formatDateTimeBG(n.dateTime)) + '</span>' +
        (n.id !== "legacy" ? '<button class="note-del" data-delete-note="' + client.id + '|' + n.id + '">✕</button>' : '') +
        '</div>' +
        '<div class="note-item-text">' + esc(n.text).replace(/\n/g, "<br>") + '</div>' +
        '</div>';
    }).join("");

    return '<div class="panel-box notes-panel">' +
      '<div class="panel-header"><span>Бележки</span></div>' +
      '<div class="note-add-row">' +
      '<textarea id="new-note-text" class="note-add-textarea sans" rows="2" placeholder="Нова бележка..."></textarea>' +
      '<button id="add-note-btn" data-add-note="' + client.id + '" class="note-add-btn">Добави бележка</button>' +
      '</div>' +
      (notes.length === 0 ? '<div class="empty-schedule sans">Все още няма бележки.</div>' : '<div class="note-list">' + rows + '</div>') +
      '</div>';
  }

  function renderScheduleTable(client, freqInfo, summary) {
    var schedule = summary.allocated;
    var today = startOfDay(new Date());
    var hasAmounts = client.amount > 0 && client.installment > 0;

    var rows = schedule.map(function (s) {
      var isOverdue = s.remaining > 0.004 && startOfDay(s.dueDate) < today;
      var overdueDays = isOverdue ? Math.round((today - startOfDay(s.dueDate)) / DAY_MS) : 0;
      var isPaid = s.remaining <= 0.004;
      return '<tr>' +
        '<td class="mono">' + s.week + '</td>' +
        '<td class="mono" style="color:' + (isOverdue ? 'var(--brick)' : 'var(--ink)') + '">' + formatDateBG(s.dueDate) + '</td>' +
        '<td class="mono" style="text-align:right">' + formatMoney(s.amount) + '</td>' +
        '<td class="mono" style="text-align:right;color:var(--teal)">' + (s.paidAmount > 0 ? formatMoney(s.paidAmount) : "—") + '</td>' +
        '<td class="mono" style="text-align:right;' + (isPaid ? '' : 'color:var(--brick)') + '">' + (isPaid ? "0.00 €" : formatMoney(s.remaining)) + '</td>' +
        '<td style="text-align:center">' + (isOverdue ? '<span class="overdue-pill mono">' + overdueDays + ' дни</span>' : (isPaid ? '<span class="sans" style="color:var(--teal);font-size:12px">✓</span>' : '<span class="sans" style="color:var(--muted);font-size:12px">—</span>')) + '</td>' +
        '</tr>';
    }).join("");

    return '<div class="panel-box">' +
      '<div class="panel-header"><span>Погасителен план (' + freqInfo.label.toLowerCase() + ')</span>' +
      (hasAmounts ? '<button class="link-btn" data-regenerate="' + client.id + '">преизчисли</button>' : '') +
      '</div>' +
      (schedule.length === 0 ?
        '<div class="empty-schedule sans">Въведи размер на кредита и вноска, за да се генерира планът.</div>' :
        '<div class="sched-wrap"><table class="sched"><thead><tr class="sans">' +
        '<th>' + freqInfo.periodLabel + '</th><th>Дата</th><th style="text-align:right">Дължимо</th>' +
        '<th style="text-align:right">Платено</th><th style="text-align:right">Остатък</th><th style="text-align:center">Закъснение</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>') +
      '</div>';
  }

  function renderPaymentsPanel(client) {
    var payments = (client.payments || []).slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    var rows = payments.map(function (p) {
      return '<div class="payment-row sans">' +
        '<span class="mono">' + formatDateBG(p.date) + '</span>' +
        '<span class="mono" style="color:var(--teal);font-weight:600;">' + formatMoney(p.amount) + '</span>' +
        '<button class="payment-del" data-delete-payment="' + client.id + '|' + p.id + '">✕</button>' +
        '</div>';
    }).join("");

    return '<div class="panel-box" style="margin-top:20px;">' +
      '<div class="panel-header"><span>Плащания</span></div>' +
      '<div class="payment-add-row sans">' +
      renderDateSelects("pay-date", toISODate(new Date())) +
      '<input id="pay-amount" class="pay-amount-input" inputmode="decimal" placeholder="Сума">' +
      '<button id="add-payment-btn" data-add-payment="' + client.id + '">Добави</button>' +
      '</div>' +
      (payments.length === 0 ?
        '<div class="empty-schedule sans">Все още няма записани плащания.</div>' :
        '<div class="payment-list">' + rows + '</div>') +
      '</div>';
  }

  function renderCalendar(client) {
    var summary = computeSummary(client.schedule, client.payments);
    var schedule = summary.allocated;
    var byDate = {};
    var today = startOfDay(new Date());
    schedule.forEach(function (s) {
      var status = s.remaining <= 0.004 ? "paid" : (startOfDay(s.dueDate) < today ? "overdue" : "upcoming");
      if (!byDate[s.dueDate]) byDate[s.dueDate] = [];
      byDate[s.dueDate].push(Object.assign({}, s, { status: status }));
    });

    var year = state.calCursor.year, month = state.calCursor.month;
    var firstOfMonth = new Date(year, month, 1);
    var startWeekday = (firstOfMonth.getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var todayISO = toISODate(new Date());

    var cellsHtml = "";
    for (var i = 0; i < startWeekday; i++) cellsHtml += '<div></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var iso = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      var items = byDate[iso];
      var isToday = iso === todayISO;
      var cls = "cal-cell";
      if (isToday) cls += " today";
      if (items) {
        var allPaid = items.every(function (it) { return it.status === "paid"; });
        var anyOverdue = items.some(function (it) { return it.status === "overdue"; });
        cls += anyOverdue ? " overdue" : (allPaid ? " paidday" : " upcoming");
      }
      var dotColor = items ? (items[0].status === "paid" ? "var(--teal)" : items[0].status === "overdue" ? "var(--brick)" : "var(--gold)") : "";
      var titleAttr = items ? ' title="' + esc(items.map(function (it) { return "Сума: " + formatMoney(it.amount); }).join(", ")) + '"' : "";
      cellsHtml += '<div class="' + cls + '" ' + titleAttr + '>' + d +
        (items ? '<div class="cal-dot" style="background:' + dotColor + '"></div>' : '') + '</div>';
    }

    return '<div class="panel-box">' +
      '<div class="panel-header"><button class="cal-nav-btn" data-cal-prev="1">‹</button>' +
      '<span>' + BG_MONTHS[month] + ' ' + year + '</span>' +
      '<button class="cal-nav-btn" data-cal-next="1">›</button></div>' +
      '<div class="cal-body">' +
      '<div class="cal-dow-row">' + BG_DAYS.map(function (dw) { return '<div class="cal-dow">' + dw + '</div>'; }).join("") + '</div>' +
      '<div class="cal-grid">' + cellsHtml + '</div>' +
      '<div class="cal-legend sans">' +
      '<span class="legend-dot"><span class="dot" style="background:var(--gold)"></span>предстои</span>' +
      '<span class="legend-dot"><span class="dot" style="background:var(--brick)"></span>просрочена</span>' +
      '<span class="legend-dot"><span class="dot" style="background:var(--teal)"></span>платена</span>' +
      '</div></div></div>';
  }

  function renderDateSelects(prefix, selectedISO) {
    var parts = (selectedISO || "").split("-");
    var selYear = parts[0] || "";
    var selMonth = parts[1] ? String(parseInt(parts[1], 10)) : "";
    var selDay = parts[2] ? String(parseInt(parts[2], 10)) : "";

    var dayOptions = '<option value="">Ден</option>';
    for (var d = 1; d <= 31; d++) {
      dayOptions += '<option value="' + d + '"' + (selDay === String(d) ? ' selected' : '') + '>' + d + '</option>';
    }
    var monthNamesShort = ["Яну", "Фев", "Мар", "Апр", "Май", "Юни", "Юли", "Авг", "Сеп", "Окт", "Ное", "Дек"];
    var monthOptions = '<option value="">Месец</option>';
    for (var m = 1; m <= 12; m++) {
      monthOptions += '<option value="' + m + '"' + (selMonth === String(m) ? ' selected' : '') + '>' + monthNamesShort[m - 1] + '</option>';
    }
    var curYear = new Date().getFullYear();
    var yearOptions = '<option value="">Година</option>';
    for (var y = curYear - 1; y <= curYear + 3; y++) {
      yearOptions += '<option value="' + y + '"' + (selYear === String(y) ? ' selected' : '') + '>' + y + '</option>';
    }

    return '<div class="date-select-row">' +
      '<select id="' + prefix + '-day" class="date-select">' + dayOptions + '</select>' +
      '<select id="' + prefix + '-month" class="date-select" style="flex:1.3;">' + monthOptions + '</select>' +
      '<select id="' + prefix + '-year" class="date-select" style="flex:1.2;">' + yearOptions + '</select>' +
      '</div>';
  }

  function renderFormModal() {
    var f = state.form;
    var isEdit = !!state.editingId;
    var freqOptions = Object.keys(FREQUENCIES).map(function (key) {
      return '<option value="' + key + '"' + (f.frequency === key ? ' selected' : '') + '>' + FREQUENCIES[key].label + '</option>';
    }).join("");

    return '<div class="modal-overlay" id="form-overlay">' +
      '<form class="modal-box sans" id="client-form">' +
      '<div class="modal-head"><div class="modal-title">' + (isEdit ? "Редактирай клиент" : "Нов клиент") + '</div>' +
      '<button type="button" class="modal-close" id="form-close">✕</button></div>' +
      field("Име", '<input id="f-name" value="' + esc(f.name) + '" placeholder="Иван Иванов">') +
      field("Телефон", '<input id="f-phone" value="' + esc(f.phone) + '" placeholder="0888 123 456">') +
      field("Номер на кредит", '<input id="f-creditNumber" value="' + esc(f.creditNumber) + '" placeholder="напр. EC-10234">') +
      field("Размер на кредита (€)", '<input id="f-amount" value="' + esc(f.amount) + '" inputmode="decimal" placeholder="1000">') +
      field("Вноска (€)", '<input id="f-installment" value="' + esc(f.installment) + '" inputmode="decimal" placeholder="50">') +
      field("Брой вноски (по избор, ако не пишеш — смята се сам)", '<input id="f-installmentCount" value="' + esc(f.installmentCount) + '" inputmode="numeric" placeholder="напр. 10">') +
      field("Периодичност", '<select id="f-frequency">' + freqOptions + '</select>') +
      field("Дата на първа вноска", renderDateSelects("f-due", f.firstDueDate)) +
      field("Месторабота", '<input id="f-workplace" value="' + esc(f.workplace) + '" placeholder="напр. завод / фирма">') +
      field("Лице за контакт – име", '<input id="f-contactName" value="' + esc(f.contactName) + '" placeholder="напр. съпруга, роднина">') +
      field("Лице за контакт – телефон", '<input id="f-contactPhone" value="' + esc(f.contactPhone) + '" placeholder="0888 000 000">') +
      (state.formError ? '<div class="form-error">' + esc(state.formError) + '</div>' : '') +
      '<div class="form-hint">Ако оставиш датата на първа вноска празна, тя ще се изчисли от днес според избраната периодичност. При запис планът се преизчислява автоматично по новите стойности — записаните плащания не се засягат.</div>' +
      '<div class="modal-actions"><button type="button" class="btn-secondary" id="form-cancel">Отказ</button>' +
      '<button type="submit" class="btn-primary">' + (isEdit ? "Запази" : "Добави") + '</button></div>' +
      '</form></div>';
  }

  function field(label, inputHtml) {
    return '<div class="field"><div class="field-label">' + label + '</div>' + inputHtml + '</div>';
  }

  function renderConfirmModal() {
    return '<div class="modal-overlay" id="confirm-overlay">' +
      '<div class="modal-box sans" style="max-width:340px">' +
      '<div style="font-size:13.5px;color:var(--ink);margin-bottom:16px;line-height:1.5">Сигурен ли си, че искаш да изтриеш този клиент? Действието не може да се отмени.</div>' +
      '<div class="modal-actions"><button class="btn-secondary" id="confirm-cancel">Отказ</button>' +
      '<button class="btn-primary danger" id="confirm-delete">Изтрий</button></div>' +
      '</div></div>';
  }

  // ---- event wiring ----
  function attachHandlers() {
    var app = document.getElementById("app");

    var searchInput = document.getElementById("search-input");
    if (searchInput) {
      searchInput.addEventListener("input", function (e) {
        state.query = e.target.value;
        var pos = e.target.selectionStart;
        render();
        var el = document.getElementById("search-input");
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      });
    }

    var addBtn = document.getElementById("add-client-btn");
    if (addBtn) addBtn.addEventListener("click", openAddForm);

    var exportBtn = document.getElementById("export-btn");
    if (exportBtn) exportBtn.addEventListener("click", exportBackup);

    var importBtn = document.getElementById("import-btn");
    var importFileInput = document.getElementById("import-file-input");
    if (importBtn && importFileInput) {
      importBtn.addEventListener("click", function () { importFileInput.click(); });
      importFileInput.addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (file) importBackup(file);
        importFileInput.value = "";
      });
    }

    app.querySelectorAll("[data-select]").forEach(function (el) {
      el.addEventListener("click", function () { selectClient(el.getAttribute("data-select")); });
    });

    app.querySelectorAll("[data-edit]").forEach(function (el) {
      el.addEventListener("click", function () {
        var c = state.clients.find(function (x) { return x.id === el.getAttribute("data-edit"); });
        if (c) openEditForm(c);
      });
    });

    app.querySelectorAll("[data-delete]").forEach(function (el) {
      el.addEventListener("click", function () { state.confirmDeleteId = el.getAttribute("data-delete"); render(); });
    });

    app.querySelectorAll("[data-regenerate]").forEach(function (el) {
      el.addEventListener("click", function () {
        var c = state.clients.find(function (x) { return x.id === el.getAttribute("data-regenerate"); });
        if (c) regenerateSchedule(c);
      });
    });

    app.querySelectorAll("[data-add-payment]").forEach(function (el) {
      el.addEventListener("click", function () {
        var clientId = el.getAttribute("data-add-payment");
        var d = document.getElementById("pay-date-day");
        var m = document.getElementById("pay-date-month");
        var y = document.getElementById("pay-date-year");
        var amountEl = document.getElementById("pay-amount");
        if (!d || !m || !y || !amountEl) return;
        if (!d.value || !m.value || !y.value) { alert("Избери дата на плащането."); return; }
        var dateISO = y.value + "-" + String(m.value).padStart(2, "0") + "-" + String(d.value).padStart(2, "0");
        addPayment(clientId, dateISO, amountEl.value);
      });
    });

    app.querySelectorAll("[data-delete-payment]").forEach(function (el) {
      el.addEventListener("click", function () {
        var parts = el.getAttribute("data-delete-payment").split("|");
        deletePayment(parts[0], parts[1]);
      });
    });

    app.querySelectorAll("[data-cal-prev]").forEach(function (el) {
      el.addEventListener("click", function () {
        var c = state.calCursor;
        state.calCursor = c.month === 0 ? { year: c.year - 1, month: 11 } : { year: c.year, month: c.month - 1 };
        render();
      });
    });
    app.querySelectorAll("[data-cal-next]").forEach(function (el) {
      el.addEventListener("click", function () {
        var c = state.calCursor;
        state.calCursor = c.month === 11 ? { year: c.year + 1, month: 0 } : { year: c.year, month: c.month + 1 };
        render();
      });
    });

    var addNoteBtn = document.getElementById("add-note-btn");
    if (addNoteBtn) {
      addNoteBtn.addEventListener("click", function () {
        var textEl = document.getElementById("new-note-text");
        var clientId = addNoteBtn.getAttribute("data-add-note");
        if (textEl && textEl.value.trim()) addNote(clientId, textEl.value);
      });
    }

    app.querySelectorAll("[data-delete-note]").forEach(function (el) {
      el.addEventListener("click", function () {
        var parts = el.getAttribute("data-delete-note").split("|");
        deleteNote(parts[0], parts[1]);
      });
    });

    var formEl = document.getElementById("client-form");
    if (formEl) {
      ["name","phone","creditNumber","amount","installment","installmentCount","frequency","workplace","contactName","contactPhone"].forEach(function (key) {
        var el = document.getElementById("f-" + key);
        if (el) el.addEventListener("input", function (e) { state.form[key] = e.target.value; });
      });

      var amountEl = document.getElementById("f-amount");
      var installmentEl = document.getElementById("f-installment");

      var dayEl = document.getElementById("f-due-day");
      var monthEl = document.getElementById("f-due-month");
      var yearEl = document.getElementById("f-due-year");
      function syncDueDate() {
        var d = dayEl ? dayEl.value : "";
        var m = monthEl ? monthEl.value : "";
        var y = yearEl ? yearEl.value : "";
        if (d && m && y) {
          state.form.firstDueDate = y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        } else {
          state.form.firstDueDate = "";
        }
      }
      if (dayEl) dayEl.addEventListener("change", syncDueDate);
      if (monthEl) monthEl.addEventListener("change", syncDueDate);
      if (yearEl) yearEl.addEventListener("change", syncDueDate);

      formEl.addEventListener("submit", submitForm);
    }
    var formClose = document.getElementById("form-close");
    if (formClose) formClose.addEventListener("click", closeForm);
    var formCancel = document.getElementById("form-cancel");
    if (formCancel) formCancel.addEventListener("click", closeForm);
    var formOverlay = document.getElementById("form-overlay");
    if (formOverlay) formOverlay.addEventListener("click", function (e) { if (e.target === formOverlay) closeForm(); });

    var confirmCancel = document.getElementById("confirm-cancel");
    if (confirmCancel) confirmCancel.addEventListener("click", function () { state.confirmDeleteId = null; render(); });
    var confirmDeleteBtn = document.getElementById("confirm-delete");
    if (confirmDeleteBtn) confirmDeleteBtn.addEventListener("click", function () { deleteClient(state.confirmDeleteId); });
    var confirmOverlay = document.getElementById("confirm-overlay");
    if (confirmOverlay) confirmOverlay.addEventListener("click", function (e) { if (e.target === confirmOverlay) { state.confirmDeleteId = null; render(); } });
  }

  loadClients();

  var APP_PASSWORD = "118342";
  var UNLOCK_KEY = "credit-organizer-unlocked";

  function showLockScreen() {
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="lock-screen"><div class="lock-box">' +
      '<div class="lock-title">Кредитен тефтер</div>' +
      '<input type="password" inputmode="numeric" class="lock-input" id="lock-input" placeholder="Парола" autofocus>' +
      '<button class="lock-btn" id="lock-submit">Отключи</button>' +
      '<div class="lock-error" id="lock-error"></div>' +
      '</div></div>';

    var input = document.getElementById("lock-input");
    var btn = document.getElementById("lock-submit");
    var errorEl = document.getElementById("lock-error");

    function tryUnlock() {
      if (input.value === APP_PASSWORD) {
        try { localStorage.setItem(UNLOCK_KEY, "true"); } catch (e) { /* ignore */ }
        render();
      } else {
        errorEl.textContent = "Грешна парола.";
        input.value = "";
        input.focus();
      }
    }

    btn.addEventListener("click", tryUnlock);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
    input.focus();
  }

  function isUnlocked() {
    try { return localStorage.getItem(UNLOCK_KEY) === "true"; } catch (e) { return false; }
  }

  if (isUnlocked()) {
    render();
  } else {
    showLockScreen();
  }
})();
</script>
</body>
</html>
